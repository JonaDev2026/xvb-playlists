name: Generate playlists and EPG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run generators
        shell: bash
        run: |
          set -o pipefail
          python run.py 2>&1 | tee -a run.log
          if grep -q "ERRORE" run.log; then
            echo "Generation reported errors; generated files will not be published."
            exit 1
          fi

      - name: Save generation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-generation-log
          path: run.log
          if-no-files-found: warn

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output epg
          if git diff --cached --quiet; then
            echo "No playlist or EPG changes to publish."
          else
            git commit -m "Update playlists and EPG"
            git push
          fi
