name: Test Rakuten playlist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rakuten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Rakuten playlist
        run: python scripts/rakuten_gen.py

      - name: Validate Rakuten playlist against EPG
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          epg_path = Path("epg/rakuten_it.xml")
          playlist_path = Path("output/Rakuten@it.m3u")

          epg_root = ET.parse(epg_path).getroot()
          epg_ids = {
              channel.get("id")
              for channel in epg_root.findall("./channel")
              if channel.get("id")
          }

          lines = playlist_path.read_text(encoding="utf-8-sig").splitlines()
          playlist_ids = []
          groups = set()

          for line in lines:
              if line.startswith("#EXTINF:"):
                  import re
                  match = re.search(r'tvg-id="([^"]*)"', line)
                  if match and match.group(1):
                      playlist_ids.append(match.group(1))
                  group = re.search(r'group-title="([^"]*)"', line)
                  if group and group.group(1):
                      groups.add(group.group(1))

          if not playlist_ids:
              raise SystemExit("ERRORE: playlist senza canali")

          if len(playlist_ids) != len(set(playlist_ids)):
              raise SystemExit("ERRORE: ID duplicati nella playlist")

          missing = sorted(set(playlist_ids) - epg_ids)
          if missing:
              raise SystemExit("ERRORE: ID non presenti nell'EPG: " + ", ".join(missing))

          print(f"OK: {len(playlist_ids)} canali")
          print(f"OK: tutti gli ID sono presenti nell'EPG")
          print(f"Generi Rakuten: {', '.join(sorted(groups))}")
          PY

      - name: Upload test playlist
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-playlist-test
          path: output/Rakuten@it.m3u
          if-no-files-found: error
          retention-days: 7
