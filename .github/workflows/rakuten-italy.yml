name: Update Rakuten Italy playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rakuten-italy-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Generate Rakuten playlist and JSON
        run: python scripts/generate_rakuten.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/rakuten_it.m3u output/rakuten_it.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Rakuten Italy playlist"
            git push
          fi
