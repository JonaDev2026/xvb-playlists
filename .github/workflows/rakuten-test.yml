name: Test Rakuten (3 channels)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rakuten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependency
        run: python -m pip install requests

      - name: Run three-channel diagnostic
        run: python scripts/rakuten_test.py 2>&1 | tee rakuten-test.log

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-three-channel-test
          if-no-files-found: warn
          path: |
            rakuten-test.log
            rakuten-test.m3u
